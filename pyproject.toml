[project]
name = "breeze-jev-backtester"
version = "0.1.0"
description = "Breeze historical replay + Jev decision backtester for NSE options"
requires-python = ">=3.11"
dependencies = [
  "breeze-connect>=1.0.69",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "pandas>=2.2",
  "typesafe-sdk>=0.7.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
breeze-jev = "breeze_jev.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["breeze_jev*"]

[tool.setuptools.package-data]
breeze_jev = ["static/*.html"]
